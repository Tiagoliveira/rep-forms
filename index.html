<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rep Forms</title>
<meta name="theme-color" content="#470a68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: Home = shelf of form cards. Form = app-style filling view (stacked cards, auto-growing boxes)
   with a "Print preview" toggle. The printed page is a separate render that copies the original paper layout. */
:root{
  /* deep purple + magenta */
  --bg:#f2eff5; --surface:#ffffff; --surface-2:#f8f6fa; --fg:#221530; --muted:#655a70; --line:#ddd5e4; --line-strong:#b8aac4;
  --bar:#470a68; --bar-fg:#ffffff; --accent:#a51890; --accent-fg:#ffffff; --accent-soft:#f4e1ef; --focus:#a5189033;
  --step:#470a68; --step-fg:#ffffff;
  --paper:#ffffff; --ink:#1b1b1b; --label:#c9dce8; --field:#eef5f9; --band:#2b2b2b; --rule:#7a8a96;
  --ui:system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#140d1a; --surface:#1f1527; --surface-2:#191120; --fg:#efe8f4; --muted:#ab9eb7; --line:#352841; --line-strong:#4f3e5e;
  --bar:#2c0642; --accent:#e47ccd; --accent-fg:#1f0a1a; --accent-soft:#3a1d36; --focus:#e47ccd40;
  --step:#e47ccd; --step-fg:#1f0a1a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--ui);min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;min-height:44px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-fg);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 #0003}
.bar-in{display:flex;align-items:center;gap:6px;min-height:56px;max-width:1000px;margin:0 auto}
.bar h1{font-size:18px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ver{font-size:12px;opacity:.55;font-weight:400;margin-left:6px}
.ib{background:transparent;color:var(--bar-fg);display:inline-flex;align-items:center;gap:6px;padding:8px 10px}
.ib:hover{background:#ffffff14}
.ib svg,.pri svg{width:21px;height:21px;flex:none}
.pri{background:var(--accent);color:var(--accent-fg);font-weight:650;display:inline-flex;align-items:center;gap:8px}
@media (max-width:560px){.lbl{display:none}.pri{padding:10px 12px}}

/* home */
.home{max-width:1000px;margin:0 auto;padding-block:28px 56px}
.home h2{font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 24px;max-width:60ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px #0000001f}
.thumb{background:var(--accent-soft);padding:18px 22px 0;height:150px;overflow:hidden}
.mini{background:#fff;height:100%;border-radius:4px 4px 0 0;box-shadow:0 2px 10px #0000002a;padding:12px 12px 0;display:flex;flex-direction:column;gap:5px}
.mini i{display:block;height:6px;border-radius:2px;background:#2b2b2b}
.mini .t{width:70%;height:7px;margin-bottom:4px}
.mini .r{display:grid;grid-template-columns:1fr 2fr;gap:3px}
.mini .r span{height:11px;background:#c9dce8}
.mini .r span+span{background:#eef5f9;border:1px solid #d5e0e7}
.mini .r.ck{grid-template-columns:1fr 9fr}
.mini .n{height:56px;background:#eef5f9;border:1px solid #d5e0e7}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cbody h3{margin:0;font-size:17px;line-height:1.25;text-wrap:balance}
.cbody p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cbody .go{margin-top:auto;padding-top:10px;color:var(--accent);font-weight:600;font-size:14px}
.privacy{margin-top:28px;display:flex;gap:12px;align-items:flex-start;color:var(--muted);font-size:14px;max-width:62ch}
.privacy svg{width:20px;height:20px;flex:none;margin-top:1px}

/* banners */
.banners{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.banners:has(.banner:not([hidden])){padding-top:12px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 14px}
.banner span{flex:1 1 200px}
.banner button{background:var(--accent);color:var(--accent-fg);font-weight:600;min-height:40px}
.banner button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

/* ── form view (screen) ── */
.formview{max-width:760px;margin:0 auto;padding-block:16px 72px}
.ftop{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ftop h2{margin:2px 0 0;font-size:24px;line-height:1.2;text-wrap:balance}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:38px;padding:6px 14px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phead{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.step{width:30px;height:30px;border-radius:50%;background:var(--step);color:var(--step-fg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.phead h3{margin:0;font-size:17px;line-height:1.2}
.phead p{margin:1px 0 0;font-size:13px;color:var(--muted)}
.pbody{padding:6px 18px 18px;display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding-top:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.q{font-weight:600;font-size:15px;line-height:1.3}
.fld:first-child{padding-top:12px}
.grid2 .fld{padding-top:0}
.inp{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;transition:border-color .12s,box-shadow .12s,background .12s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus);background:var(--surface)}
textarea.inp{resize:none;overflow:hidden;line-height:1.5;display:block}
.inp::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;min-height:38px;font-size:14px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.chip:has(input:checked) .tick{background:var(--accent);border-color:var(--accent)}
.chip:has(input:checked) .tick::after{content:"";width:8px;height:4px;border:2px solid var(--accent-fg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.hintrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hintrow small{color:var(--muted);font-size:12px;margin-right:2px}
.hintbtn{min-height:32px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--fg);font-size:13px}
.sub{font-size:13px;color:var(--muted)}

/* checklist (screen) */
.phead .prog{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.phead .prog.done{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.clist{display:flex;flex-direction:column}
.citem{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.citem:first-child{border-top:0}
.citem:hover{background:var(--surface-2)}
.citem input{position:absolute;opacity:0;pointer-events:none}
.cbox{width:24px;height:24px;border:2px solid var(--line-strong);border-radius:7px;flex:none;display:grid;place-items:center;background:var(--surface);transition:background .12s,border-color .12s}
.citem:has(input:checked) .cbox{background:var(--accent);border-color:var(--accent)}
.citem:has(input:checked) .cbox::after{content:"";width:11px;height:6px;border:2.5px solid var(--accent-fg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.citem:has(input:checked) .ctext{color:var(--muted)}
.citem:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:-3px}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;font-size:15px}
.callout.final{border:2px solid var(--fg);font-weight:600}

/* table entries + sketch (screen) */
.entries{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.entry{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.entry h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.egrid .fld{padding-top:0;gap:4px}
.egrid .fld label{font-size:13px;font-weight:600}
.egrid .inp{min-height:42px;padding:9px 10px;background:var(--surface)}
select.inp{appearance:auto}
.addrow{align-self:flex-start;background:transparent;color:var(--accent);border:1.5px dashed var(--accent);font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums;margin-right:4px}
.sketchnote{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:14px;padding-top:12px}
.sketchnote .pad{width:64px;height:48px;flex:none;border:1.5px dashed var(--line-strong);border-radius:8px;background-image:radial-gradient(var(--line-strong) 1px,transparent 1px);background-size:8px 8px}

/* preview wrapper */
.pzbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pzbar button{min-height:38px;min-width:42px;padding:6px 12px;background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:600}
.pzbar span{font-size:13px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.preview{touch-action:pan-x pan-y;overflow:auto;overscroll-behavior:contain;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;height:70vh}
.preview .sheet{margin:0 auto}
html.previewing,html.previewing body{overflow:hidden;overscroll-behavior:none}
html.previewing .formview{padding-bottom:0}
.preview .sheet{box-shadow:0 1px 3px #0002,0 10px 30px #0000001a;border-radius:3px}

/* ── the printed page: copies the original paper layout ── */
.sheet{background:var(--paper);color:var(--ink);width:210mm;min-width:210mm;margin:0 auto;padding:10mm 10mm;font:9.5pt/1.3 Arial,Helvetica,sans-serif;color-scheme:light}
.s-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 5px 30mm}
.s-head h2{font-size:13pt;margin:0;text-transform:uppercase;letter-spacing:.01em;font-weight:700}
.logo{display:flex;align-items:center;gap:5px;line-height:1}
.logo b{display:block;font-size:13pt;letter-spacing:.02em}
.logo small{display:block;font-size:5.5pt;letter-spacing:.32em;font-weight:700}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheet td{border:1px solid var(--rule);vertical-align:top;padding:4px 6px}
.sheet td.l{background:var(--label);font-weight:700}
.sheet td.v{background:var(--field);white-space:pre-wrap;word-wrap:break-word}
.sheet .hdr{margin-bottom:9px}
.sheet .sec{margin-bottom:0}
.sheet .sec+.sec .band td{border-top:0}
.sheet .band td{background:var(--band);color:#fff;padding:5px 8px;border-color:var(--band)}
.sheet .band b{font-size:11pt;text-transform:uppercase;margin-right:8px}
.sheet .band span{font-size:8.5pt}
.sheet tr{break-inside:avoid}
.sheet tr.band{break-after:avoid}
.sheet table.keep{break-inside:avoid}
.sheet .hints{font-weight:400;font-style:italic;margin-top:8px;line-height:1.35}
.sheet .opts{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:8.5pt;margin-bottom:3px}
.sheet .box{display:inline-block;width:9px;height:9px;border:1px solid #333;margin-right:4px;vertical-align:-1px;position:relative}
.sheet .box.on::after{content:"✓";position:absolute;left:0;top:-4px;font-size:10px;font-weight:700}
.sheet .oth{font-size:8.5pt}
.sheet .oth u{text-decoration:none;border-bottom:1px solid #333;display:inline-block;min-width:60mm;padding:0 3px}
.sheet .val{white-space:pre-wrap}
.sheet.ck{font-size:10pt}
.sheet.ck .s-head{margin-left:0;align-items:flex-start}
.sheet.ck .s-head h2{font-size:17pt;line-height:1.1;max-width:62%}
.sheet td.cb{background:var(--label);text-align:center;vertical-align:middle;padding:3px}
.sheet td.cb .box{width:11px;height:11px;margin:0}
.sheet td.cb .box.on::after{font-size:13px;top:-5px;left:1px}
.sheet td.t{background:var(--field)}
.sheet td.intro{background:var(--field);font-size:9pt}
.sheet td.fin{background:#fff;border:1.5px solid #222;font-weight:700;font-size:10.5pt;padding:6px 8px}
.sheet td.full{background:var(--field);padding:0}
.sheet table.grid{margin:0}
.sheet table.grid th{background:var(--label);font-size:8.5pt;text-align:left;padding:3px 5px;border:1px solid var(--rule);font-weight:700}
.sheet table.grid td{height:6.2mm;padding:2px 5px;font-size:9pt;background:var(--field)}
.sheet table.grid td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet table.grid tr.tot td{background:var(--label);font-weight:700}
.sheet td.full.sketch{background-color:#fff;background-image:radial-gradient(#b9c6ce 0.6px,transparent 0.7px);background-size:5mm 5mm}
.sheet table.grid th.grp{text-align:center;font-size:9pt;letter-spacing:.04em}
.sheet table.grid th.sub{text-align:center}
.sheet table.grid thead{display:table-header-group}
.sheet.plain{font-size:10pt}
.sheet.land{width:297mm;min-width:297mm}
.sheet .ptitle{font-size:20pt;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6mm;font-weight:800;font-stretch:condensed}
.sheet.plain table.grid th{background:#fff;border:1.2px solid #222;text-transform:uppercase;font-size:8.5pt;vertical-align:bottom}
.sheet.plain table.grid{width:99%}
.sheet.plain table.grid td{background:#fff;border:1.2px solid #222;vertical-align:top}
.sheet .pfoot{margin-top:5mm}
.printroot{display:none}

@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  .bar,.banners,.home,.formview{display:none!important}
  .printroot{display:block!important}
  .sheet{width:auto;min-width:0;padding:0;margin:0}
  .sheet.land{width:auto;min-width:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in gut">
    <button class="ib" id="back" type="button" hidden aria-label="All forms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Forms</span>
    </button>
    <h1 id="barTitle">Rep Forms<span class="ver" id="ver"></span></h1>
    <button class="ib" id="clear" type="button" hidden aria-label="Clear form">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span class="lbl">Clear</span>
    </button>
    <button class="pri" id="print" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg><span class="lbl">Print / PDF</span>
    </button>
  </div>
</header>

<div class="banners gut">
  <div class="banner" id="updateBanner" hidden>
    <span>A new version of Rep Forms is ready.</span>
    <button type="button" id="updateBtn">Update now</button>
    <button type="button" class="ghost" id="updateLater">Later</button>
  </div>
  <div class="banner" id="confirmBox" hidden>
    <span id="confirmMsg"></span>
    <button type="button" id="confirmYes">Continue</button>
    <button type="button" class="ghost" id="confirmNo">Cancel</button>
  </div>
</div>

<main id="home" class="home gut">
  <h2>Choose a form</h2>
  <p class="lede">Tap a form to fill it in, then print it or save it as a PDF.</p>
  <div class="shelf" id="shelf"></div>
  <div class="privacy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span>Nothing you type is saved on this device or sent anywhere. When you leave a form or close the app, it’s gone. Print or save a PDF first.</span>
  </div>
</main>

<main id="formview" class="formview gut" hidden>
  <div class="ftop">
    <div><div class="eyebrow" id="fOrg"></div><h2 id="fTitle"></h2></div>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="vFill" aria-pressed="true">Fill in</button>
      <button type="button" id="vPrev" aria-pressed="false">Print preview</button>
    </div>
  </div>
  <div id="fill" class="stack"></div>
  <div id="previewWrap" hidden>
    <div class="pzbar" role="group" aria-label="Preview zoom">
      <button type="button" id="pzOut" aria-label="Zoom out">−</button>
      <button type="button" id="pzFit">Fit</button>
      <button type="button" id="pzIn" aria-label="Zoom in">+</button>
      <span id="pzLabel">Pinch the page to zoom</span>
    </div>
    <div id="preview" class="preview"></div>
  </div>
</main>

<div class="printroot" id="printroot"></div>

<script src="forms.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {}, dirty = false, current = null;

/* ── in-page confirm ── */
function ask(msg, yesLabel = 'Continue') {
  return new Promise(res => {
    $('#confirmMsg').textContent = msg; $('#confirmYes').textContent = yesLabel;
    $('#confirmBox').hidden = false; $('#confirmYes').focus(); window.scrollTo({top:0});
    const done = v => { $('#confirmBox').hidden = true; $('#confirmYes').onclick = $('#confirmNo').onclick = null; res(v); };
    $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false);
  });
}

/* ── home shelf ── */
function thumb(f) {
  const rows = f.sections.flatMap(s => s.rows).slice(0, 5);
  if (f.kind === 'checklist') return `<div class="thumb"><div class="mini"><i class="t"></i><i></i>${
    Array.from({length: 7}, (_, i) => i === 3 ? '<i></i>' : '<div class="r ck"><span></span><span></span></div>').join('')}</div></div>`;
  return `<div class="thumb"><div class="mini"><i class="t"></i><div class="r"><span></span><span></span></div><i></i>${
    rows.length === 1 ? '<div class="n"></div>' : rows.map(() => '<div class="r"><span></span><span></span></div>').join('')}</div></div>`;
}
$('#shelf').innerHTML = FORMS.map(f => `
  <a class="card" href="#${esc(f.id)}">${thumb(f)}
    <div class="cbody">${f.org ? `<div class="eyebrow">${esc(f.org)}</div>` : ''}
      <h3>${esc(f.title)}</h3>${f.description ? `<p>${esc(f.description)}</p>` : ''}
      <div class="go">Open form →</div></div></a>`).join('');

/* ── helpers ── */
const isDate = l => /^date\b/i.test(l);
const fmtDate = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (v || ''); };
const isSingleNotes = (s, r) => s.rows.length === 1 && r.label === s.title;
const tCount = (k, r) => Math.max(1, Math.min(r.rows || 8, +state[k + 'n'] || (r.start ?? 3)));
const numVal = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
function tableTotals(k, r, upto) {
  const sums = {};
  r.columns.forEach((c, ci) => { if (c.sum) { sums[ci] = 0; for (let i = 0; i < upto; i++) sums[ci] += numVal(state[`${k}_${i}_${ci}`]); } });
  let density = null;
  if (r.density) { const [m, t] = r.density; density = sums[t] ? Math.round(sums[m] / sums[t] * 100) : null; }
  const yes = {};
  r.columns.forEach((c, ci) => { if (c.countYes) { yes[ci] = 0; for (let i = 0; i < upto; i++) if (state[`${k}_${i}_${ci}`] === 'Yes') yes[ci]++; } });
  let named = 0; for (let i = 0; i < upto; i++) if ((state[`${k}_${i}_0`] || '').trim()) named++;
  return {sums, density, yes, named};
}
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

/* ── screen: app-style form ── */
function renderChecklist(form) {
  let html = form.intro ? `<div class="callout"><b>${esc(form.intro.label)}</b> ${esc(form.intro.text)}</div>` : '';
  form.sections.forEach((s, si) => {
    const items = s.items.map((t, ii) => `<label class="citem"><input type="checkbox" data-k="s${si}i${ii}"><span class="cbox"></span><span class="ctext">${esc(t)}</span></label>`).join('');
    html += `<section class="panel"><div class="phead"><div class="step">${s.num}</div><div><h3>${esc(s.title)}</h3>${s.sub ? `<p>${esc(s.sub)}</p>` : ''}</div><span class="prog" data-sec="${si}" data-n="${s.items.length}"></span></div><div class="clist">${items}</div></section>`;
  });
  if (form.final) html += `<div class="callout final">${esc(form.final)}</div>`;
  $('#fill').innerHTML = html;
  $('#fill').querySelectorAll('[data-k]').forEach(el => el.checked = !!state[el.dataset.k]);
  updateProgress();
}
function updateProgress() {
  document.querySelectorAll('#fill .prog').forEach(p => {
    const n = +p.dataset.n, done = Object.keys(state).filter(k => state[k] && k.startsWith(`s${p.dataset.sec}i`)).length;
    p.textContent = `${done} / ${n}`; p.classList.toggle('done', done === n);
  });
}
function renderFill(form) {
  if (form.kind === 'checklist') return renderChecklist(form);
  const hdr = (form.header || []).flat().map((l, i) => {
    const id = `h${i}`;
    return `<div class="fld"><label for="${id}">${esc(l)}</label>
      <input class="inp" id="${id}" data-k="${id}" type="${isDate(l) ? 'date' : 'text'}" autocomplete="off"></div>`;
  }).join('');
  let html = hdr ? `<section class="panel"><div class="phead"><div><h3>${esc(form.headerTitle || 'Case details')}</h3></div></div><div class="pbody"><div class="grid2">${hdr}</div></div></section>` : '';
  form.sections.forEach((s, si) => {
    const rows = s.rows.map((r, ri) => {
      const k = `s${si}r${ri}`;
      const rowsAttr = Math.max(2, Math.min(r.lines || 2, 10));
      const ta = `<textarea class="inp" id="${k}" data-k="${k}" rows="${rowsAttr}" placeholder="${r.type === 'checks' ? 'References and notes' : 'Type here…'}"></textarea>`;
      if (r.type === 'table') {
        const n = tCount(k, r);
        const entries = Array.from({length: n}, (_, i) => `<div class="entry"><h4>${esc(r.item || 'Row')} ${i + 1}</h4><div class="egrid">${
          r.columns.map((c, ci) => {
            const id = `${k}_${i}_${ci}`;
            const ctl = c.type === 'pick'
              ? `<select class="inp" id="${id}" data-k="${id}" data-pick="${esc(c.from)}"></select>`
              : c.type === 'yn'
              ? `<select class="inp" id="${id}" data-k="${id}"><option value="">Choose…</option>${(c.options || ['Yes', 'No', 'Unsure']).map(o => `<option>${esc(o)}</option>`).join('')}</select>`
              : `<input class="inp" id="${id}" data-k="${id}" ${c.type === 'num' ? 'type="number" inputmode="numeric" min="0"' : 'type="text"'} autocomplete="off">`;
            return `<div class="fld"><label for="${id}">${esc(c.name)}</label>${ctl}</div>`;
          }).join('')}</div></div>`).join('');
        const add = n < (r.rows || 8) ? `<button type="button" class="addrow" data-add="${k}" data-n="${n}">+ Add ${esc((r.item || 'row').toLowerCase())}</button>` : '';
        const tot = r.columns.some(c => c.sum || c.countYes) ? `<div class="totals" data-tot="${k}" data-si="${si}" data-ri="${ri}"></div>` : '';
        return `<div class="entries">${entries}${add}${tot}</div>`;
      }
      if (r.type === 'sketch') return `<div class="sketchnote"><span class="pad"></span><span>The printout leaves a dotted box here to sketch the layout by hand: departments, entrances, break room, notice board.</span></div>`;
      if (r.type === 'checks') {
        const chips = r.options.map((o, oi) => `<label class="chip"><input type="checkbox" data-k="${k}o${oi}"><span class="tick"></span>${esc(o)}</label>`).join('');
        const other = r.other ? `<input class="inp" data-k="${k}x" aria-label="Other document" placeholder="Other document…">` : '';
        return `<div class="fld"><div class="q">${esc(r.label)}</div><div class="chips">${chips}</div>${other}${ta}</div>`;
      }
      const hints = r.hints ? `<div class="hintrow"><small>Tap to add a heading:</small>${r.hints.map(h => `<button type="button" class="hintbtn" data-for="${k}">${esc(h)}</button>`).join('')}</div>` : '';
      const lab = isSingleNotes(s, r) ? '' : `<label for="${k}">${esc(r.label)}</label>`;
      return `<div class="fld">${lab}${hints}${ta}</div>`;
    }).join('');
    html += `<section class="panel"><div class="phead">${s.num ? `<div class="step">${s.num}</div>` : ''}<div><h3>${esc(s.title)}</h3>${s.sub ? `<p>${esc(s.sub)}</p>` : ''}</div></div><div class="pbody">${rows}</div></section>`;
  });
  $('#fill').innerHTML = html;
  $('#fill').querySelectorAll('[data-k]').forEach(el => {
    const v = state[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else if (v != null) el.value = v;
    if (el.tagName === 'TEXTAREA') grow(el);
  });
  updateTotals(form);
  refreshPicks(form);
}
/* dropdowns that list the names typed into another table (e.g. a person's department) */
function refreshPicks(form = FORMS.find(f => f.id === current)) {
  document.querySelectorAll('#fill select[data-pick]').forEach(sel => {
    let src = null;
    form.sections.forEach((s, si) => (s.rows || []).forEach((r, ri) => { if (r.type === 'table' && r.label === sel.dataset.pick) src = {k: `s${si}r${ri}`, r}; }));
    if (!src) return;
    const names = [...new Set(Array.from({length: src.r.rows || 8}, (_, i) => (state[`${src.k}_${i}_0`] || '').trim()).filter(Boolean))];
    const cur = state[sel.dataset.k] || '';
    if (cur && !names.includes(cur)) names.push(cur);
    sel.innerHTML = `<option value="">${names.length ? 'Choose…' : 'Add a department first'}</option>` + names.map(n => `<option${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
  });
}
function updateTotals(form = FORMS.find(f => f.id === current)) {
  document.querySelectorAll('#fill [data-tot]').forEach(el => {
    const r = form.sections[+el.dataset.si].rows[+el.dataset.ri], k = el.dataset.tot;
    const {sums, density, yes, named} = tableTotals(k, r, r.rows || 8);
    el.innerHTML = Object.values(yes).map(y => `<span class="stat"><b>${y} of ${named}</b>joined</span>`).join('')
      + Object.entries(sums).map(([ci, v]) => `<span class="stat"><b>${v}</b>${esc(r.columns[ci].name.toLowerCase())}</span>`).join('')
      + (r.density ? `<span class="stat"><b>${density == null ? '–' : density + '%'}</b>membership density</span>` : '');
  });
}
$('#fill').addEventListener('input', e => {
  const el = e.target; if (!el.dataset.k) return;
  state[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.tagName === 'TEXTAREA') grow(el);
  if (el.type === 'checkbox') updateProgress();
  if (el.type === 'number') updateTotals();
  if (el.closest('.entries')) { if (el.tagName === 'INPUT') refreshPicks(); updateTotals(); }
  dirty = true;
});
$('#fill').addEventListener('click', e => {
  const a = e.target.closest('.addrow');
  if (a) {
    const k = a.dataset.add, n = +a.dataset.n; state[k + 'n'] = n + 1;
    const y = window.scrollY; renderFill(FORMS.find(f => f.id === current)); window.scrollTo({top: y});
    document.getElementById(`${k}_${n}_0`)?.focus({preventScroll: false});
    return;
  }
  const b = e.target.closest('.hintbtn'); if (!b) return;
  const t = document.getElementById(b.dataset.for);
  const pre = t.value && !t.value.endsWith('\n') ? '\n' : '';
  t.value += `${pre}${b.textContent}: `;
  t.dispatchEvent(new Event('input', {bubbles: true}));
  t.focus(); t.setSelectionRange(t.value.length, t.value.length);
});
window.addEventListener('resize', () => document.querySelectorAll('#fill textarea').forEach(grow));

/* ── print: copy of the original paper form ── */
function logoFor(form) {
  return form.org ? `<div class="logo"><span><b>${esc(form.org.split(' ')[0])}</b><small>${esc(form.org.split(' ').slice(1).join(' '))}</small></span></div>` : '';
}
function renderChecklistSheet(form) {
  const intro = form.intro ? `<table class="sec"><tr><td class="intro"><b>${esc(form.intro.label)}</b> ${esc(form.intro.text)}</td></tr></table>` : '';
  const secs = form.sections.map((s, si) => {
    const rows = s.items.map((t, ii) => `<tr><td class="cb"><span class="box${state[`s${si}i${ii}`] ? ' on' : ''}"></span></td><td class="t">${esc(t)}</td></tr>`).join('');
    return `<table class="sec"><colgroup><col style="width:6%"><col></colgroup><tr class="band"><td colspan="2"><b>${s.num}. ${esc(s.title)}</b><span>${esc(s.sub || '')}</span></td></tr>${rows}</table>`;
  }).join('');
  const fin = form.final ? `<table class="sec"><tr><td class="fin">${esc(form.final)}</td></tr></table>` : '';
  return `<div class="sheet ck"><div class="s-head"><h2>${esc(form.title)}</h2>${logoFor(form)}</div>${intro}${secs}${fin}</div>`;
}
function printGrid(k, r) {
  const v = key => esc(state[key] || '');
  const used = Array.from({length: r.rows || 8}, (_, i) => r.columns.some((c, ci) => state[`${k}_${i}_${ci}`])).lastIndexOf(true) + 1;
  const n = Math.max(r.printRows ?? r.rows ?? 8, used);
  const grouped = r.columns.some(c => c.group);
  let head;
  if (grouped) {
    let top = '', i = 0;
    while (i < r.columns.length) {
      const g = r.columns[i].group;
      if (!g) { top += `<th rowspan="2">${esc(r.columns[i].name)}</th>`; i++; continue; }
      let span = 0; while (i + span < r.columns.length && r.columns[i + span].group === g) span++;
      top += `<th colspan="${span}" class="grp">${esc(g)}</th>`; i += span;
    }
    head = `<tr>${top}</tr><tr>${r.columns.filter(c => c.group).map(c => `<th class="sub">${esc(c.name)}</th>`).join('')}</tr>`;
  } else head = `<tr>${r.columns.map(c => `<th>${esc(c.name)}</th>`).join('')}</tr>`;
  const rh = r.rowHeight ? ` style="height:${r.rowHeight}mm"` : '';
  const body = Array.from({length: n}, (_, i) => `<tr${rh}>${r.columns.map((c, ci) => `<td class="${c.type === 'num' ? 'n' : ''}">${v(`${k}_${i}_${ci}`)}</td>`).join('')}</tr>`).join('');
  let tot = '';
  if (r.columns.some(c => c.sum)) {
    const {sums, density} = tableTotals(k, r, n), any = used > 0;
    tot = `<tr class="tot">${r.columns.map((c, ci) => `<td class="${c.sum ? 'n' : ''}">${ci === 0 ? 'Total' + (r.density ? ` · density ${any && density != null ? density + '%' : '____%'}` : '') : (c.sum && any ? sums[ci] : '')}</td>`).join('')}</tr>`;
  }
  return `<table class="grid"><colgroup>${r.columns.map(c => `<col style="width:${c.w || 15}%">`).join('')}</colgroup><thead>${head}</thead><tbody>${body}${tot}</tbody></table>`;
}
/* a form that is just one big table (e.g. the recruitment planner) */
function renderPlainSheet(form) {
  const r = form.sections[0].rows[0];
  return `<div class="sheet plain${form.layout === 'landscape' ? ' land' : ''}"><h2 class="ptitle">${esc(form.title)}</h2>${printGrid('s0r0', r)}<div class="pfoot">${logoFor(form)}</div></div>`;
}
function renderSheet(form) {
  if (form.kind === 'checklist') return renderChecklistSheet(form);
  if (form.plain) return renderPlainSheet(form);
  const v = k => esc(state[k] || '');
  const hdrCells = (form.header || []).map((row, ri) => `<tr>${row.map((l, ci) => {
    const k = `h${ri * row.length + ci}`;
    return `<td class="l">${esc(l)}</td><td class="v">${isDate(l) ? esc(fmtDate(state[k])) : v(k)}</td>`;
  }).join('')}</tr>`).join('');
  const lineH = 1.3 * 9.5 * 0.3528; // mm per line
  const secs = form.sections.map((s, si) => {
    const rows = s.rows.map((r, ri) => {
      const k = `s${si}r${ri}`, h = `min-height:${((r.lines || 2) * lineH + 2).toFixed(1)}mm`;
      let body;
      if (r.type === 'table') return `<tr><td class="full" colspan="2">${printGrid(k, r)}</td></tr>`;
      if (r.type === 'sketch') return `<tr><td class="full sketch" colspan="2"><div style="height:${r.height || 70}mm"></div></td></tr>`;
      if (r.type === 'checks') {
        body = `<div class="opts">${r.options.map((o, oi) => `<span><span class="box${state[`${k}o${oi}`] ? ' on' : ''}"></span>${esc(o)}</span>`).join('')}${
          r.other ? `<span class="oth"><span class="box${state[k + 'x'] ? ' on' : ''}"></span>Other: <u>${v(k + 'x')}</u></span>` : ''}</div><div class="val">${v(k)}</div>`;
      } else body = `<div class="val">${v(k)}</div>`;
      const hints = r.hints ? `<div class="hints">${r.hints.map(esc).join('<br>')}</div>` : '';
      return isSingleNotes(s, r)
        ? `<tr><td class="v" colspan="2"><div style="${h}">${body}</div></td></tr>`
        : `<tr><td class="l">${esc(r.label)}${hints}</td><td class="v"><div style="${h}">${body}</div></td></tr>`;
    }).join('');
    const band = `<tr class="band"><td colspan="2"><b>${s.num ? s.num + '. ' : ''}${esc(s.title)}</b><span>${esc(s.sub || '')}</span></td></tr>`;
    const keep = s.rows.some(r => r.type === 'sketch') ? ' keep' : '';
    return `<table class="sec${keep}"><colgroup><col style="width:28%"><col></colgroup>${band}${rows}</table>`;
  }).join('');
  const logo = form.org ? `<div class="logo"><span><b>${esc(form.org.split(' ')[0])}</b><small>${esc(form.org.split(' ').slice(1).join(' '))}</small></span></div>` : '';
  return `<div class="sheet"><div class="s-head"><h2>${esc(form.title)}</h2>${logo}</div>
    <table class="hdr"><colgroup><col style="width:22%"><col style="width:22%"><col style="width:22%"><col style="width:34%"></colgroup>${hdrCells}</table>${secs}</div>`;
}
function setPageSize(f) {
  let el = document.getElementById('pagesize');
  if (!el) { el = document.createElement('style'); el.id = 'pagesize'; document.head.appendChild(el); }
  el.textContent = `@media print{@page{size:A4 ${f && f.layout === 'landscape' ? 'landscape' : 'portrait'};margin:8mm}}`;
}
const refreshPrint = () => { const f = FORMS.find(f => f.id === current); setPageSize(f); if (f) $('#printroot').innerHTML = renderSheet(f); };
window.addEventListener('beforeprint', refreshPrint);

function setView(prev) {
  $('#vFill').setAttribute('aria-pressed', !prev); $('#vPrev').setAttribute('aria-pressed', prev);
  $('#fill').hidden = prev; $('#previewWrap').hidden = !prev; pz = 1;
  document.documentElement.classList.toggle('previewing', prev);
  if (prev) { window.scrollTo({top: 0}); $('#preview').innerHTML = renderSheet(FORMS.find(f => f.id === current)); $('#preview').scrollTop = 0; fitPreview(); }
  else $('#fill').querySelectorAll('textarea').forEach(grow);
}
/* preview-only zoom: pz is a multiple of the fit-to-width size */
let pz = 1, fitZ = 1;
function fitPreview() {
  const sh = $('#preview .sheet'), box = $('#preview'); if (!sh) return;
  // the window fills the screen below its own top edge, so the page never needs to scroll
  box.style.height = Math.max(260, window.innerHeight - box.getBoundingClientRect().top - 16) + 'px';
  sh.style.zoom = 1; fitZ = Math.min(1, (box.clientWidth - 24) / sh.offsetWidth); applyZoom();
}
function applyZoom(cx, cy) {
  const sh = $('#preview .sheet'), box = $('#preview'); if (!sh) return;
  const before = parseFloat(sh.style.zoom) || fitZ;
  pz = Math.min(4, Math.max(1, pz));
  const after = fitZ * pz; sh.style.zoom = after;
  if (cx != null) {               // keep the point under the fingers in place
    const k = after / before, r = box.getBoundingClientRect();
    const x = cx - r.left; box.scrollLeft = (box.scrollLeft + x) * k - x;
    const y = cy - r.top; box.scrollTop = (box.scrollTop + y) * k - y;
  }
  $('#pzLabel').textContent = pz === 1 ? 'Pinch the page to zoom' : Math.round(pz * 100) + '%';
}
$('#pzIn').onclick = () => { pz *= 1.4; applyZoom(); };
$('#pzOut').onclick = () => { pz /= 1.4; applyZoom(); };
$('#pzFit').onclick = () => { pz = 1; applyZoom(); };
let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
$('#preview').addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = {d: dist(e.touches), z: pz}; }, {passive: true});
$('#preview').addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  pz = pinch.z * dist(e.touches) / pinch.d;
  applyZoom((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
}, {passive: false});
$('#preview').addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
/* block pinch / gesture zoom everywhere else (iOS ignores user-scalable=no) */
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#preview')) e.preventDefault(); }, {passive: false});
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('wheel', e => { if (e.ctrlKey && !e.target.closest('#preview')) e.preventDefault(); }, {passive: false});
$('#preview').addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); pz *= e.deltaY < 0 ? 1.1 : 1 / 1.1; applyZoom(e.clientX, e.clientY); } }, {passive: false});
window.addEventListener('resize', fitPreview);
$('#vFill').onclick = () => setView(false);
$('#vPrev').onclick = () => setView(true);

/* ── routing ── */
function show() {
  const form = FORMS.find(f => f.id === location.hash.slice(1));
  $('#home').hidden = !!form; $('#formview').hidden = !form;
  ['#back', '#clear', '#print'].forEach(s => $(s).hidden = !form);
  $('#confirmBox').hidden = true;
  if (!form) document.documentElement.classList.remove('previewing');
  if (form) {
    if (current !== form.id) { state = {}; dirty = false; current = form.id; renderFill(form); setView(false); }
    setPageSize(form);
    $('#fOrg').textContent = form.org || ''; $('#fTitle').textContent = form.title;
    $('#barTitle').firstChild.textContent = form.title.split(' – ')[0];
    document.title = form.title + ' · Rep Forms';
  } else {
    current = null; state = {}; dirty = false; $('#fill').innerHTML = $('#preview').innerHTML = $('#printroot').innerHTML = '';
    $('#barTitle').firstChild.textContent = 'Rep Forms'; document.title = 'Rep Forms';
  }
  window.scrollTo({top: 0});
}
let lastHash = location.hash;
window.addEventListener('hashchange', async () => {
  if (dirty && current && location.hash !== lastHash) {
    const target = location.hash;
    history.replaceState(null, '', lastHash || location.pathname);
    if (!(await ask('Leave this form? What you’ve typed will be cleared.', 'Leave'))) return;
    dirty = false; history.pushState(null, '', target || location.pathname);
  }
  lastHash = location.hash; show();
});
show();

$('#back').onclick = () => { location.hash = ''; };
$('#print').onclick = () => { refreshPrint(); window.print(); };
$('#clear').onclick = async () => {
  if (dirty && !(await ask('Clear everything on this form?', 'Clear'))) return;
  const f = FORMS.find(f => f.id === current); state = {}; dirty = false; renderFill(f); setView(false);
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ── offline + opt-in updates ── */
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => {
      $('#updateBanner').hidden = false;
      $('#updateLater').onclick = () => $('#updateBanner').hidden = true;
      $('#updateBtn').onclick = async () => {
        if (dirty && !(await ask('Updating reloads the app and clears this form.', 'Update'))) return;
        w.postMessage('SKIP_WAITING');
      };
    };
    if (reg.waiting && hadController) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    if (navigator.onLine) reg.update().catch(() => {});
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return; reloading = true; dirty = false; location.reload();
  });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.version) $('#ver').textContent = e.data.version; });
  navigator.serviceWorker.ready.then(r => r.active?.postMessage('GET_VERSION'));
}
</script>
</body>
</html>
